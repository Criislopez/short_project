name: Deploy on dev (staging)

on:
  push:
    branches: ["main"]

jobs: 
  deploy-dev:
    runs-on: ubuntu-latest
    enviroment: staging

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install dependencies
        run: npm install

      - name: Run migrations (staging)
        run: node run scripts/migrate-up
        env:
          DB_URL: ${{ secrets.DB_URL }}